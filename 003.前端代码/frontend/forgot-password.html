<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7F9">
  <meta name="description" content="轻记：使用恢复码找回密码。">
  <title>轻记 · 找回密码</title>
  <link rel="icon" href="assets/img/peach.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-layout="auth" data-page="forgot">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="site-header"></header>

  <main id="main" class="auth-page">
    <section class="auth-card" aria-labelledby="forgot-title">
      <img class="auth-mascot" src="assets/img/peach.svg" alt="">
      <h1 id="forgot-title">找回密码</h1>
      <p class="auth-sub">输入用户名和恢复码，设置新密码。轻记没有邮箱和手机号，恢复码是唯一的自助找回凭证。</p>

      <form class="auth-form" data-auth-form="forgot">
        <div class="form-field">
          <label class="form-label" for="recover-username">用户名</label>
          <input class="input" id="recover-username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="recovery-code-input">恢复码<span class="label-hint">16 位</span></label>
          <input class="input" id="recovery-code-input" name="recovery-code" type="text" autocomplete="one-time-code" placeholder="例如：7K2M-9QXA-4T8P-W3NC" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="recover-password">新密码<span class="label-hint">8–64 位，含字母和数字</span></label>
          <div class="input-shell">
            <input class="input" id="recover-password" name="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="64" pattern="(?=.*[A-Za-z])(?=.*\d).{8,64}" title="至少 8 位，并同时包含字母和数字" placeholder="设置新密码" required>
            <button class="password-toggle" type="button" data-password-toggle data-target="#recover-password" aria-label="显示密码">
              <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-eye"></use></svg>
            </button>
          </div>
        </div>
        <div class="form-field">
          <label class="form-label" for="recover-confirm">确认新密码</label>
          <div class="input-shell">
            <input class="input" id="recover-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="64" data-confirm-of="#recover-password" placeholder="请再次输入新密码" required>
            <button class="password-toggle" type="button" data-password-toggle data-target="#recover-confirm" aria-label="显示密码">
              <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-eye"></use></svg>
            </button>
          </div>
        </div>

        <p class="form-error" id="forgot-error" hidden></p>
        <button class="btn btn--primary btn--block" type="submit">重置密码</button>
      </form>

      <p class="auth-switch">想起密码了？ <a href="login.html">返回登录</a></p>
      <p class="auth-note">没有保存恢复码，就无法自助找回。恢复码可在「账号与安全」中查看（原型演示）。</p>
    </section>
  </main>

  <nav id="mobile-nav"></nav>
  <footer id="site-footer"></footer>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
