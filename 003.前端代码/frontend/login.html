<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7F9">
  <meta name="description" content="轻记：使用用户名和密码登录。">
  <title>轻记 · 登录</title>
  <link rel="icon" href="assets/img/peach.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-layout="auth" data-page="login">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="site-header"></header>

  <main id="main" class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
      <img class="auth-mascot" src="assets/img/peach.svg" alt="">
      <h1 id="login-title">欢迎回来</h1>
      <p class="auth-sub">登录后继续你的账本。只用用户名和密码，不收集手机号或邮箱。</p>

      <form class="auth-form" data-auth-form="login">
        <div class="form-field">
          <label class="form-label" for="login-username">用户名</label>
          <input class="input" id="login-username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="login-password">密码</label>
          <div class="input-shell">
            <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
            <button class="password-toggle" type="button" data-password-toggle data-target="#login-password" aria-label="显示密码">
              <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-eye"></use></svg>
            </button>
          </div>
        </div>
        <div class="auth-row">
          <span class="form-hint">登录状态默认保持 30 天</span>
          <a class="text-link" href="forgot-password.html">忘记密码？</a>
        </div>
        <p class="form-error" id="login-error" hidden></p>
        <button class="btn btn--primary btn--block" type="submit">登录</button>
      </form>

      <p class="auth-switch">还没有账号？ <a href="register.html">注册新账号</a></p>
      <p class="auth-note">账号由本地认证服务校验，密码不会保存在前端。</p>
    </section>
  </main>

  <nav id="mobile-nav"></nav>
  <footer id="site-footer"></footer>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/ledger.js" defer></script>
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
