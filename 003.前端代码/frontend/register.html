<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7F9">
  <meta name="description" content="轻记：只用用户名和密码注册。">
  <title>轻记 · 注册</title>
  <link rel="icon" href="assets/img/peach.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-layout="auth" data-page="register">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="site-header"></header>

  <main id="main" class="auth-page">
    <section class="auth-card" aria-labelledby="register-title">
      <img class="auth-mascot" src="assets/img/peach.svg" alt="">
      <h1 id="register-title">创建账号</h1>
      <p class="auth-sub">只需用户名和密码，不收集手机号或邮箱。用户名注册后不可修改。</p>

      <form class="auth-form" data-auth-form="register">
        <div class="form-field">
          <label class="form-label" for="register-username">用户名<span class="label-hint">2–20 位</span></label>
          <input class="input" id="register-username" name="username" type="text" autocomplete="username" minlength="2" maxlength="20" placeholder="中文、字母、数字或下划线" required>
          <span class="form-hint">不区分大小写判重；注册后不能修改</span>
        </div>
        <div class="form-field">
          <label class="form-label" for="register-password">设置密码<span class="label-hint">8–64 位，含字母和数字</span></label>
          <div class="input-shell">
            <input class="input" id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="64" pattern="(?=.*[A-Za-z])(?=.*\d).{8,64}" title="至少 8 位，并同时包含字母和数字" placeholder="设置密码" required>
            <button class="password-toggle" type="button" data-password-toggle data-target="#register-password" aria-label="显示密码">
              <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-eye"></use></svg>
            </button>
          </div>
        </div>
        <div class="form-field">
          <label class="form-label" for="register-confirm">确认密码</label>
          <div class="input-shell">
            <input class="input" id="register-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="64" data-confirm-of="#register-password" placeholder="请再次输入密码" required>
            <button class="password-toggle" type="button" data-password-toggle data-target="#register-confirm" aria-label="显示密码">
              <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-eye"></use></svg>
            </button>
          </div>
        </div>

        <label class="checkbox-row">
          <input id="privacy-consent" type="checkbox" required>
          <span>我已阅读并同意 <a href="privacy.html">《隐私说明》</a>；明白忘记密码时需使用恢复码找回。</span>
        </label>

        <p class="form-error" id="register-error" hidden></p>
        <button class="btn btn--primary btn--block" type="submit" data-register-submit disabled>注册</button>
      </form>

      <p class="auth-switch">已有账号？ <a href="login.html">立即登录</a></p>
      <p class="auth-note">账号会写入本地 MySQL 数据库，密码以 Argon2id 哈希保存，注册成功后自动生成恢复码。</p>
    </section>
  </main>

  <nav id="mobile-nav"></nav>
  <footer id="site-footer"></footer>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/ledger.js" defer></script>
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
