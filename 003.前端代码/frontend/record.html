<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7F9">
  <meta name="description" content="轻记：3 秒记一笔。">
  <title>轻记 · 记一笔</title>
  <link rel="icon" href="assets/img/peach.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-layout="record" data-page="record" data-title="记一笔" data-back="index.html">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="site-header"></header>

  <main id="main" class="page">
    <h1 class="sr-only">记一笔</h1>
    <div class="record-layout">
      <form class="card record-card" id="record-form" novalidate>
        <p class="record-lead">金额之外，其他都可以不改。</p>

        <div class="type-switch" role="group" aria-label="收支类型">
          <button type="button" data-record-type="expense" class="is-active" aria-pressed="true">支出</button>
          <button type="button" data-record-type="income" aria-pressed="false">收入</button>
        </div>

        <div class="record-amount">
          <span class="currency">¥</span>
          <input id="record-amount" type="text" inputmode="decimal" maxlength="11" autocomplete="off" placeholder="0.00" aria-label="金额">
        </div>
        <div class="record-amount-note">
          <span><span data-record-type-value>支出</span> · 2026年11月20日 周五</span>
          <span>最多两位小数</span>
        </div>

        <div class="quick-amounts" aria-label="快捷金额">
          <button class="quick-chip" type="button" data-add-amount="20">+ 20</button>
          <button class="quick-chip" type="button" data-add-amount="35">+ 35</button>
          <button class="quick-chip" type="button" data-add-amount="50">+ 50</button>
        </div>

        <fieldset class="form-section">
          <legend class="sr-only">选择分类</legend>
          <div class="form-section__head">
            <strong>选择分类</strong>
            <span>已选：<span data-selected-category>午餐</span></span>
          </div>
          <div class="recent-chips" id="recent-categories" aria-label="最近分类"></div>
          <div class="category-grid" id="category-grid"></div>
        </fieldset>

        <div class="record-meta">
          <div class="record-row">
            <span class="record-row__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-calendar"></use></svg></span>
            <div class="record-row__copy">
              <label class="record-row__label" for="record-date">记账日期</label>
              <input id="record-date" type="date" value="2026-11-20">
            </div>
          </div>
          <div class="record-row">
            <span class="record-row__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-edit"></use></svg></span>
            <div class="record-row__copy">
              <label class="record-row__label" for="record-note">添加备注</label>
              <input id="record-note" type="text" maxlength="200" placeholder="例如：和同事吃拉面">
            </div>
          </div>
        </div>

        <div class="check-row">
          <span>保存后继续记下一笔</span>
          <label class="switch">
            <input id="save-again" type="checkbox">
            <span class="switch__track"></span>
          </label>
        </div>

        <p class="form-error" id="record-error" hidden></p>
        <div class="record-submit">
          <button class="btn btn--primary" type="submit">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-check-circle"></use></svg>
            保存这笔
          </button>
        </div>
      </form>

      <aside class="record-side">
        <section class="card budget-card" aria-labelledby="record-month-title">
          <div class="budget-head">
            <span class="category-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chart"></use></svg></span>
            <span class="budget-title" id="record-month-title">本月概览</span>
            <a class="text-link" href="stats.html">统计<svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chevron-right"></use></svg></a>
          </div>
          <div class="record-month-grid">
            <div><span>支出</span><strong id="record-month-expense">¥0.00</strong></div>
            <div><span>收入</span><strong class="income" id="record-month-income">¥0.00</strong></div>
          </div>
          <div class="record-month-foot">本月 <span id="record-month-count">0 笔</span> 记录</div>
        </section>

        <section class="card today-card" aria-labelledby="today-title">
          <div class="today-card__head"><h3 id="today-title">今日已记</h3><span id="today-summary">今天还没有记录</span></div>
          <div id="today-list"><div class="today-empty">今天还没有记录，记下第一笔吧。</div></div>
        </section>

        <section class="card suggestion-card" aria-labelledby="suggestion-title">
          <h3 id="suggestion-title"><svg class="icon icon--sm" aria-hidden="true"><use href="assets/icons.svg#icon-sparkles"></use></svg>轻轻建议</h3>
          <p>不用追求完美。先填金额，分类和备注都可以后补；拿不准时就选「其他」。想长期坚持，记得偶尔去备份。</p>
          <div class="suggestion-chips">
            <a class="quick-chip" href="categories.html">管理分类</a>
            <a class="quick-chip" href="data.html">去备份</a>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <nav id="mobile-nav"></nav>
  <footer id="site-footer"></footer>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
