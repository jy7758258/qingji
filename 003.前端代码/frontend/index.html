<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7F9">
  <meta name="description" content="轻记：轻轻记下每一笔的个人记账原型。">
  <title>轻记 · 明细</title>
  <link rel="icon" href="assets/img/peach.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-layout="app" data-page="home" data-active="home">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="site-header"></header>

  <main id="main" class="page">
    <div class="page-head">
      <div>
        <h1>明细</h1>
        <p>每一笔，都是生活的注脚。</p>
      </div>
      <span class="page-head__side" data-today-label>2026年11月20日 周五</span>
    </div>

    <div class="home-layout">
      <aside class="home-side">
        <section class="card summary-card" aria-labelledby="monthly-summary-title">
          <div class="summary-head">
            <span class="summary-label" id="monthly-summary-title">本月支出（元）</span>
            <span class="delta" id="home-delta">还没有记录</span>
          </div>
          <div class="summary-amount"><span class="currency">¥</span><span id="home-expense">0.00</span></div>
          <img class="mascot-sticker" src="assets/img/peach.svg" alt="">
          <div class="summary-split">
            <div><span>本月总收入</span><strong class="income" id="home-income">¥0.00</strong></div>
            <div><span>当前结余</span><strong id="home-balance">¥0.00</strong></div>
          </div>
          <div class="summary-foot">
            <span>本月 <strong id="home-count">0 笔</strong></span>
            <span>日均支出 <strong id="home-avg">¥0.00</strong></span>
          </div>
        </section>

        <section class="card budget-card" id="home-category-card" aria-labelledby="home-category-title" hidden>
          <div class="budget-head">
            <span class="category-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chart"></use></svg></span>
            <span class="budget-title" id="home-category-title">本月分类</span>
            <a class="text-link" href="stats.html">查看统计<svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chevron-right"></use></svg></a>
          </div>
          <div class="home-categories" id="home-categories"></div>
        </section>

        <section class="streak-card" aria-label="记账提示">
          <span class="streak-card__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-sparkles"></use></svg></span>
          <div>
            <h3>轻轻记</h3>
            <p>先记下金额，分类和备注都可以后补。</p>
            <p class="quote">「不用一次记完，想到哪笔就记哪笔。」</p>
          </div>
        </section>
      </aside>

      <section class="home-main">
        <div class="card ledger-card" aria-labelledby="ledger-title">
          <div class="ledger-card__head">
            <h2 id="ledger-title">账目</h2>
            <span id="ledger-count">共 0 笔</span>
          </div>
          <div id="ledger-body"></div>
        </div>
      </section>
    </div>
  </main>

  <nav id="mobile-nav"></nav>
  <footer id="site-footer"></footer>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
