server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: qingji-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/qingji?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:qingji}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      connection-init-sql: SET time_zone = '+00:00'
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 10

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500}
  session:
    cookie-name: ${SESSION_COOKIE_NAME:QJ_SESSION}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    ttl-days: ${SESSION_TTL_DAYS:30}
    same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

logging:
  level:
    com.qingji.backend: INFO
    org.springframework.security: WARN
